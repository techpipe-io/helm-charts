name: Publish aggregate Helm index

on:
  push:
    branches:
      - main
    paths:
      - repositories.yml
      - .github/workflows/publish-helm-index.yml

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-aggregate-helm-index
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish index.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "PyYAML>=6.0,<7.0"

      - name: Build aggregate index
        run: |
          python scripts/build-index.py \
            --config repositories.yml \
            --output public/index.yaml

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          PAGES_DIR="${RUNNER_TEMP}/gh-pages"

          rm -rf "${PAGES_DIR}"

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            gh-pages \
            >/dev/null 2>&1
          then
            echo "Using existing gh-pages branch"

            git fetch origin gh-pages

            git worktree add \
              --detach \
              "${PAGES_DIR}" \
              origin/gh-pages
          else
            echo "Creating gh-pages branch"

            git worktree add \
              --detach \
              "${PAGES_DIR}" \
              HEAD

            (
              cd "${PAGES_DIR}"

              git checkout --orphan gh-pages

              git rm -rf . \
                >/dev/null 2>&1 || true
            )
          fi

          #
          # Ignore the top-level `generated` timestamp when
          # deciding whether the index has actually changed.
          #
          # This prevents a no-op commit every 15 minutes.
          #
          if [[ -f "${PAGES_DIR}/index.yaml" ]]; then
            if python - \
              public/index.yaml \
              "${PAGES_DIR}/index.yaml" <<'PY'
          import sys
          import yaml

          def load(path):
              with open(path, "r", encoding="utf-8") as fh:
                  data = yaml.safe_load(fh) or {}

              data.pop("generated", None)

              return data

          new_index = load(sys.argv[1])
          old_index = load(sys.argv[2])

          raise SystemExit(
              0 if new_index == old_index else 1
          )
          PY
            then
              echo "Aggregate Helm index has not changed"
              exit 0
            fi
          fi

          cp \
            public/index.yaml \
            "${PAGES_DIR}/index.yaml"

          touch "${PAGES_DIR}/.nojekyll"

          (
            cd "${PAGES_DIR}"

            git config \
              user.name \
              "github-actions[bot]"

            git config \
              user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              index.yaml \
              .nojekyll

            if git diff \
              --cached \
              --quiet
            then
              echo "Nothing to publish"
              exit 0
            fi

            git commit \
              -m "Update aggregate Helm index"

            git push \
              origin \
              HEAD:gh-pages
          )
